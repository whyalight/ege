   if(need){const m=merge(loc,rem);ea().set(m);if(sk(m)!=sk(rem))send();else st('синхронизировано')}else{ea().set(rem);st('синхронизировано')}return}
  if(sk(rem)!=sk(loc))ea().set(rem);
  st('синхронизировано')},
 e=>{st('нет связи');console.error(e)})};
const ER={'auth/invalid-credential':'Неверная почта или пароль','auth/wrong-password':'Неверный пароль','auth/user-not-found':'Аккаунт не найден','auth/email-already-in-use':'Эта почта уже зарегистрирована — нажмите «Войти»','auth/weak-password':'Пароль слишком короткий (минимум 6 символов)','auth/invalid-email':'Некорректная почта','auth/network-request-failed':'Нет связи с Firebase','auth/operation-not-allowed':'В Firebase не включён вход по почте и паролю','auth/too-many-requests':'Слишком много попыток, подождите немного'};
const msg=t=>{const m=md.querySelector('#clm');if(m)m.textContent=t};
const dlg=()=>{let h='<i data-cl hidden></i>';
 if(!ready)h+='<h3>☁️ Синхронизация</h3><p>Вставьте сюда настройки Firebase (блок firebaseConfig). Это нужно один раз на каждом устройстве.</p><textarea id="clc" placeholder="apiKey: ..., authDomain: ..., projectId: ..."></textarea><div class=ac><button class="b on" id="cls">Сохранить настройки</button><button class=b data-x style="margin-left:auto">Закрыть</button></div><p id="clm"></p>';
 else if(!user)h+='<h3>☁️ Вход</h3><p>Первый раз нажмите «Создать аккаунт», потом на всех устройствах просто «Войти» с теми же почтой и паролем.</p><input id="cle" type="email" placeholder="Почта" autocomplete="username"><input id="clp" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><div class=ac><button class="b on" id="cli">Войти</button><button class=b id="clr">Создать аккаунт</button><button class=b id="clf">Забыли пароль?</button></div><div class=ac style="margin-top:8px"><button class=b data-x style="margin-left:auto">Закрыть</button></div><p id="clm"></p>';
 else h+='<h3>☁️ Синхронизация</h3><p>Вы вошли как '+String(user.email).replace(/</g,'&lt;')+'</p><p>Отметки и заметки сохраняются автоматически и появляются на других устройствах после входа в этот же аккаунт.</p><div class=ac><button class=b id="clo">Выйти</button><button class=b data-x style="margin-left:auto">Закрыть</button></div>';
 md.innerHTML=h;ov.classList.add('on')};
document.addEventListener('click',async e=>{const id=e.target.id;
 if(id=='cl'){dlg();return}
 if(id=='cls'){const o={};for(const m of md.querySelector('#clc').value.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
  if(!o.apiKey||!o.projectId){msg('Не нашёл apiKey и projectId — вставьте блок firebaseConfig целиком');return}
  localStorage.setItem('eb_fbc',JSON.stringify(o));location.reload();return}
 if(id=='cli'||id=='clr'){const em=md.querySelector('#cle').value.trim(),pw=md.querySelector('#clp').value;if(!em||!pw){msg('Введите почту и пароль');return}
  msg('Подождите…');try{if(id=='cli')await signInWithEmailAndPassword(auth,em,pw);else await createUserWithEmailAndPassword(auth,em,pw)}catch(x){msg(ER[x.code]||('Ошибка: '+x.code))}return}
 if(id=='clf'){const em=md.querySelector('#cle').value.trim();if(!em){msg('Введите почту и нажмите ещё раз');return}
  try{await sendPasswordResetEmail(auth,em);msg('Письмо для сброса пароля отправлено')}catch(x){msg(ER[x.code]||('Ошибка: '+x.code))}return}
 if(id=='clo'){await signOut(auth);dlg()}});
if(ready){auth=getAuth(initializeApp(cfg));db=getFirestore(auth.app);
 onAuthStateChanged(auth,u=>{unsub&&unsub();unsub=null;booted=false;user=u;uid=u?u.uid:null;if(u)start();else st('войти');
  if(ov.classList.contains('on')&&md.querySelector('[data-cl]'))dlg()})}
else st('настроить');
</script>
</body></html>
